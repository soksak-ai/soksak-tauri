[package]
name = "soksak-store"
version = "0.0.1"
edition = "2021"

[dependencies]
# libc 는 프레임워크가 아니라 OS 호출 그 자체다 — 쓰기 실패의 순간에 프로세스 형편을 잰다
# (write_policy). 그 판정이 껍데기에 있으면 같은 이름이 프로세스마다 다르게 쓴다.
libc = "0.2"
# 인프로세스 SQLite(FTS5 trigram = CJK 부분일치). 이 의존성 때문에 이 규칙은 soksak-core 에
# 못 산다 — 코어는 무의존을 지킨다. 저장소는 프레임워크가 아니라 **자원**이다.
# 저장소와 같은 판을 쓴다 — 판이 갈리면 같은 파일을 두 라이브러리가 열고 잠금 규약이 어긋난다.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
soksak-core = { path = "../soksak-core" }
soksak-seal = { path = "../soksak-seal" }
# 열쇠 유도·복구 코드는 볼트가 소유한다 — 키 표(여기)와 그 열쇠(볼트)는 다른 자리다.
soksak-vault = { path = "../soksak-vault" }
