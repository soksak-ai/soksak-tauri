[package]
name = "soksak-cored"
version = "0.0.1"
publish = false
edition = "2021"
description = "Helper process that serves framework-free commands over a socket: the app's framework-free command logic, answered by a process that owns no window and no framework."

# 의존성은 좁게 유지한다 — 이 프로세스의 존재 이유가 "프레임워크가 없다"는 것이다. tauri/wry 가
# 여기 들어오는 순간 이 크레이트는 두 번째 프레임워크가 된다. 로직은 전부 soksak-core 이
# 소유하고 여기는 배선만 한다.
[dependencies]
base64 = "0.22"
soksak-spec-pty = { path = "../soksak-spec-pty" }
soksak-core = { path = "../soksak-core" }
soksak-store = { path = "../soksak-store" }
soksak-watch = { path = "../soksak-watch" }
soksak-spec-socket = { path = "../soksak-spec-socket" }
# HTTP 전송기. 그 몸이 async 라 tokio 를 끌고 오지만, 이 프로세스의 동시성 모형은 안 바뀐다 —
# soksak-net 이 sync 표면(honest_get_bytes)만 노출하고 런타임을 자기 안에 가둔다. 이 크레이트는
# 그 전에도 UDP(net_udp_request)를 졌다: 네트워크는 프레임워크가 아니라 자원이다.
soksak-schedule = { path = "../soksak-schedule" }
soksak-spec-service = { path = "../soksak-spec-service" }
soksak-service = { path = "../soksak-service" }
soksak-vault = { path = "../soksak-vault" }
soksak-daemon = { path = "../soksak-daemon" }
soksak-net = { path = "../soksak-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 저장소는 프레임워크가 아니라 자원이다 — 로직(KvRows)은 코어가 소유하고 여기는 그 구현 하나를 준다.
rusqlite = { version = "0.32", features = ["bundled"] }
# libc 는 프레임워크가 아니라 OS 호출 그 자체다 — 창도 런타임도 없고, 스폰한 자식 그룹에
# 신호를 보내는 자리에서만 쓴다(killpg). 그 신호가 없으면 트리를 낳은 명령이 손자를 남긴다.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
