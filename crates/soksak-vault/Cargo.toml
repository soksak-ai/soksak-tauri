[package]
name = "soksak-vault"
version = "0.0.1"
edition = "2021"

[dependencies]
# 볼트의 몸 — 열쇠 유도(Argon2)·항목 봉인(XChaCha20-Poly1305)·복구 코드·파일 형식.
# 창도 앱 핸들도 OS 키체인도 모른다. KEK 는 **주입**받는다(KekSource) — 그것을 어디서
# 얻는지가 플랫폼의 일이고, 볼트는 그 바이트로 무엇을 하는지만 안다.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
# 비대칭 봉인(X25519) — 봉인 형식의 단일진실이 별개 크레이트다.
soksak-seal = { path = "../soksak-seal" }
# 복구 코드 검증자 해시.
sha2 = "0.10"
soksak-core = { path = "../soksak-core" }

[features]
# 검사용 생성자 — 소비자의 dev-dependencies 에서만 켠다.
testing = []

# OS 키체인(device KEK 투명 언락) — 볼트 KEK 를 OS 보안 저장소에 get-or-create.
# 키체인은 **플랫폼** 자원이지 프레임워크 자원이 아니다. 껍데기에 두면 볼트 파일은 홈에 사는데
# 그 열쇠가 프레임워크로 갈리고, 홈을 공유해도 둘째 껍데기는 그 볼트를 못 연다.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Linux 는 D-Bus Secret Service(GNOME Keyring/KWallet). sync-secret-service = 동기 dbus 백엔드,
# crypto-rust = D-Bus 세션 암호화를 순수 Rust AES 로(OpenSSL 시스템 의존 회피).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# apple-native = macOS Keychain(Security.framework). keyring::Entry 가 앱 신원 ACL 에 KEK 결속.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
