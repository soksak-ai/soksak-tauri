[package]
name = "soksak-schedule"
version = "0.0.1"
publish = false
edition = "2021"
description = "Scheduler: trigger arithmetic, job ledger, lease and backoff, and the fire path. No window and no framework — firing touches two contracts only (command dispatch, schedule state)."

# 프레임워크를 의존하지 않는다. 발화는 계약 둘만 만진다 — 앱에 남는 것은 조립(상태 조회·영속)뿐이다.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soksak-core = { path = "../soksak-core" }
