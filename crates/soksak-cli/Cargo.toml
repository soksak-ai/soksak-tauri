# sok — soksak 원격 제어 CLI. 앱 크레이트와 분리된 워크스페이스 멤버
# (같은 패키지의 [[bin]] 으로 두면 tauri 번들러가 메인 바이너리를 오인한다).
[package]
name = "sok"
version = "0.0.1"
publish = false
edition = "2021"

# 이름별 실물 바이너리 3개(src/bin/) — 공용 본체는 lib(src/lib.rs). 링크·복사 없음(P9).

[dependencies]
# 소켓 프로토콜 계약(버전 상수+호환창+순수 판정) — 앱과 공유하는 단일진실, 상수 사본 금지.
soksak-spec-socket = { path = "../soksak-spec-socket" }
# identity 두 축(framework/env) 판정 — 홈을 가르는 축이 무엇인지는 코어가 단일진실이다.
soksak-core = { path = "../soksak-core" }
serde_json = "1"
